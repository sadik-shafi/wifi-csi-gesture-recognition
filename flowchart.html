<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiFi CSI Gesture Recognition — System Flowchart</title>
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #e6edf3;
    --sub:     #7d8590;
    --blue:    #58a6ff;
    --green:   #3fb950;
    --purple:  #bc8cff;
    --yellow:  #e3b341;
    --red:     #f85149;
    --teal:    #39d353;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:      #f6f8fa;
      --surface: #ffffff;
      --border:  #d0d7de;
      --text:    #1f2328;
      --sub:     #57606a;
      --blue:    #0969da;
      --green:   #1a7f37;
      --purple:  #8250df;
      --yellow:  #9a6700;
      --red:     #cf222e;
      --teal:    #116329;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 3rem;
  }
  h1 {
    text-align: center;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
    color: var(--text);
  }
  .subtitle {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-bottom: 2.5rem;
  }
  svg {
    display: block;
    margin: 0 auto;
    max-width: 820px;
    width: 100%;
    height: auto;
    overflow: visible;
  }
</style>
</head>
